<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posições</title>
    <style>
        #relativo{
           position: relative;
           height: 90vh;
           padding: 10px;
           background-color: purple;
           background-image: url('Imagens/target001.png');
           background-size: 100% 100%;
        }
        #absoluto{
            height: 200px;
            width: 400px;
            position: absolute;
            background-color: yellow;
            background-image: url('Imagens/target001.png');
            background-size: 100% 100%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="relativo">
        <div id="absoluto">

        </div>
    </div>   
</body>
</html>
